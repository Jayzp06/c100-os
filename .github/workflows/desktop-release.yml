name: Desktop Release

# Triggers:
#   - Push a version tag:  git tag v0.9.1 && git push --tags
#   - Manual dispatch from the GitHub Actions UI
#
# Branch pushes to main do NOT trigger this workflow — doing so would create a
# release tagged "main" and would skip updater artifacts because no version tag
# is present.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

env:
  # Vite build env vars required by artifacts/c100
  PORT: '23873'
  BASE_PATH: '/'
  # Production API base URL — bake into the desktop bundle so the WebView can
  # reach the live server.  Set VITE_API_URL in GitHub → Settings → Secrets.
  # Example: https://c100-api.username.repl.co
  VITE_API_URL: ${{ secrets.VITE_API_URL }}

jobs:
  # ─────────────────────────────────────────────────────────
  #  macOS — universal binary (.dmg) covering Intel + Apple Silicon
  #
  #  Signing mode is selected automatically:
  #    • APPLE_CERTIFICATE absent/empty  → unsigned DMG (default)
  #    • APPLE_CERTIFICATE present       → signed + notarized DMG
  #
  #  To enable signing, add these GitHub repository secrets:
  #    APPLE_CERTIFICATE            (base64-encoded .p12 file)
  #    APPLE_CERTIFICATE_PASSWORD   (password for the .p12)
  #    APPLE_SIGNING_IDENTITY       (e.g. "Developer ID Application: ...")
  #    APPLE_ID                     (Apple ID email)
  #    APPLE_ID_PASSWORD            (app-specific password)
  #    APPLE_TEAM_ID                (10-character team ID)
  # ─────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    # Expose the secret as a job-level env var so step if: conditions can read
    # it via the env context (secrets context is not available in if: expressions).
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4

      # ── Pre-flight: verify updater signing secrets are present ───────────────
      # Fail immediately — before the expensive Rust compile — if either secret
      # is missing.  Aliases (SIGN_KEY / SIGN_PASS) are used so that the secret
      # names are not echoed in the log even if GitHub's masking is bypassed.
      - name: Verify updater signing secrets
        run: |
          missing=""
          [ -z "$SIGN_KEY" ]  && missing="${missing}\n  - TAURI_SIGNING_PRIVATE_KEY"
          [ -z "$SIGN_PASS" ] && missing="${missing}\n  - TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "ERROR: The following required GitHub repository secrets are not configured:"
            printf "%b\n" "$missing"
            echo ""
            echo "These secrets are needed to sign updater artifacts (.sig files)."
            echo "Without them the installed application cannot verify update authenticity."
            echo "Add them at: GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Updater signing secrets are present."
        env:
          SIGN_KEY:  ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGN_PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: artifacts/c100-desktop/src-tauri -> target

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (artifacts/c100)
        run: pnpm --filter @workspace/c100 run build

      # ── Unsigned build ──────────────────────────────────────────────────────
      # No Apple signing env vars are passed — Tauri will not attempt signing.
      - name: Build Tauri app (universal macOS, unsigned)
        if: ${{ env.APPLE_CERTIFICATE == '' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: artifacts/c100-desktop
          tauriScript: pnpm tauri
          args: --target universal-apple-darwin
          # __VERSION__ is replaced by tauri-action with the version from tauri.conf.json.
          # This ensures the release is tagged v0.9.1 (not "main") regardless of
          # which branch or event triggered the workflow.
          tagName: v__VERSION__
          releaseName: 'C100 Operations v__VERSION__'
          releaseBody: |
            C100 Trailblazing Chapter Operations Console — macOS installer.

            Requires macOS 10.15 Catalina or later.
          releaseDraft: ${{ github.event.inputs.draft != 'false' }}
          prerelease: false
          includeUpdaterJson: true

      # ── Signed + notarized build ────────────────────────────────────────────
      # Apple signing env vars are only injected when APPLE_CERTIFICATE is set.
      # tauri-action v0 handles certificate import internally.
      - name: Build Tauri app (universal macOS, signed)
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: artifacts/c100-desktop
          tauriScript: pnpm tauri
          args: --target universal-apple-darwin
          tagName: v__VERSION__
          releaseName: 'C100 Operations v__VERSION__'
          releaseBody: |
            C100 Trailblazing Chapter Operations Console — macOS installer.

            Requires macOS 10.15 Catalina or later.
          releaseDraft: ${{ github.event.inputs.draft != 'false' }}
          prerelease: false
          includeUpdaterJson: true

      # ── Post-build: assert updater signature files were produced ─────────────
      # A green build that silently skipped .sig files must not pass.
      - name: Assert updater artifacts exist (.sig files)
        run: |
          sig_count=$(find artifacts/c100-desktop/src-tauri/target \
                        -name "*.sig" 2>/dev/null | wc -l | tr -d '[:space:]')
          if [ "$sig_count" -eq 0 ]; then
            echo "ERROR: No updater signature files (.sig) found in the build output."
            echo "Verify that:"
            echo "  1. bundle.createUpdaterArtifacts = true in tauri.conf.json"
            echo "  2. TAURI_SIGNING_PRIVATE_KEY is set and non-empty in GitHub secrets"
            exit 1
          fi
          echo "Updater artifacts verified — ${sig_count} .sig file(s) produced:"
          find artifacts/c100-desktop/src-tauri/target -name "*.sig"

  # ─────────────────────────────────────────────────────────
  #  Windows — x64 MSI installer
  # ─────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (.msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ── Pre-flight: verify updater signing secrets are present ───────────────
      - name: Verify updater signing secrets
        shell: pwsh
        run: |
          $missing = @()
          if ([string]::IsNullOrEmpty($env:SIGN_KEY))  { $missing += "TAURI_SIGNING_PRIVATE_KEY" }
          if ([string]::IsNullOrEmpty($env:SIGN_PASS)) { $missing += "TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }
          if ($missing.Count -gt 0) {
            Write-Host "ERROR: The following required GitHub repository secrets are not configured:"
            $missing | ForEach-Object { Write-Host "  - $_" }
            Write-Host ""
            Write-Host "These secrets are needed to sign updater artifacts (.sig files)."
            Write-Host "Without them the installed application cannot verify update authenticity."
            Write-Host "Add them at: GitHub → Settings → Secrets and variables → Actions"
            exit 1
          }
          Write-Host "Updater signing secrets are present."
        env:
          SIGN_KEY:  ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGN_PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: artifacts/c100-desktop/src-tauri -> target

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (artifacts/c100)
        run: pnpm --filter @workspace/c100 run build

      - name: Build Tauri app (Windows x64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: artifacts/c100-desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: 'C100 Operations v__VERSION__'
          releaseBody: |
            C100 Trailblazing Chapter Operations Console — Windows installer.

            Requires Windows 10 (1803+) or Windows 11.
            WebView2 is included via the system component (auto-installed if absent).
          releaseDraft: ${{ github.event.inputs.draft != 'false' }}
          prerelease: false
          includeUpdaterJson: true

      # ── Post-build: assert updater signature files were produced ─────────────
      - name: Assert updater artifacts exist (.sig files)
        shell: pwsh
        run: |
          $sigs = Get-ChildItem -Recurse -Filter "*.sig" `
                    -Path "artifacts/c100-desktop/src-tauri/target" `
                    -ErrorAction SilentlyContinue
          if ($sigs.Count -eq 0) {
            Write-Host "ERROR: No updater signature files (.sig) found in the build output."
            Write-Host "Verify that:"
            Write-Host "  1. bundle.createUpdaterArtifacts = true in tauri.conf.json"
            Write-Host "  2. TAURI_SIGNING_PRIVATE_KEY is set and non-empty in GitHub secrets"
            exit 1
          }
          Write-Host "Updater artifacts verified — $($sigs.Count) .sig file(s) produced:"
          $sigs | ForEach-Object { Write-Host $_.FullName }
