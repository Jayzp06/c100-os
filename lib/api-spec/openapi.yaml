            $ref: '#/components/schemas/AttendanceRecord'
        participationGoalPct:
          type: number

    OrgSettings:
      type: object
      required:
        - universityName
        - chapterName
        - chapterIdentifier
        - primaryColor
        - secondaryColor
        - participationGoalPct
        - scholarshipMinPct
        - conferenceMinPct
        - awardsMinPct
        - duesAmountCents
      properties:
        universityName:
          type: string
          example: Fort Valley State University
        chapterName:
          type: string
          example: Trailblazing Chapter
        chapterIdentifier:
          type: string
          example: Trailblazing
        motto:
          type: [string, 'null']
          example: Discipline. Service. Excellence.
        primaryColor:
          type: string
          example: 'hsl(221 100% 31%)'
        secondaryColor:
          type: string
          example: '#C9A227'
        logoUrl:
          type: [string, 'null']
        participationGoalPct:
          type: number
          example: 75
        scholarshipMinPct:
          type: number
          example: 80
        conferenceMinPct:
          type: number
          example: 85
        awardsMinPct:
          type: number
          example: 90
        duesAmountCents:
          type: integer
          example: 0

    OrgSettingsUpdate:
      type: object
      properties:
        universityName:
          type: string
        chapterName:
          type: string
        chapterIdentifier:
          type: string
        motto:
          type: [string, 'null']
        primaryColor:
          type: string
        secondaryColor:
          type: string
        logoUrl:
          type: [string, 'null']
        participationGoalPct:
          type: number
          minimum: 0
          maximum: 100
        scholarshipMinPct:
          type: number
          minimum: 0
          maximum: 100
        conferenceMinPct:
          type: number
          minimum: 0
          maximum: 100
        awardsMinPct:
          type: number
          minimum: 0
          maximum: 100
        duesAmountCents:
          type: integer
          minimum: 0

