openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: C100 System API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Profile
    description: Current user profile and onboarding
  - name: Members
    description: Chapter members
  - name: Committees
    description: Chapter committees
  - name: Events
    description: Chapter events and QR check-in
  - name: Attendance
    description: Member attendance records
  - name: Nudges
    description: Behavioral nudge messages
  - name: Reports
    description: Eligibility, leaderboards, and dashboards
  - name: OrgSettings
    description: Organisation-level configuration (identity, branding, thresholds)
  - name: EventTypeConfig
    description: Admin-configurable auto-scoring rules per event type
  - name: System
    description: Application identity, release notes, and diagnostics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect after login.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /me:
    get:
      tags: [Profile]
      operationId: getMyProfile
      summary: Get the current member's profile and role
      responses:
        '200':
          description: Profile loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [Profile]
      operationId: updateMyProfile
      summary: Update the current member's profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileInput'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'

  /me/experience:
    post:
      tags: [Profile]
      operationId: switchMyExperience
      summary: Switch active view among experiences the member legitimately holds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchExperienceInput'
      responses:
        '200':
          description: Active experience switched. Returns updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Member does not hold a role granting that experience.
    delete:
      tags: [Profile]
      operationId: resetMyExperience
      summary: Reset active view back to the member's default (highest-priority) experience
      responses:
        '200':
          description: Experience override cleared. Returns default profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'

  /me/dashboard:
    get:
      tags: [Profile]
      operationId: getMyDashboard
      summary: Get the current member's dashboard payload
      responses:
        '200':
          description: Dashboard data assembled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDashboard'

  /me/nudges:
    get:
      tags: [Nudges]
      operationId: listMyNudges
      summary: List nudges for the current member
      responses:
        '200':
          description: Nudge list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NudgeLogEntry'

  /members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: List all chapter members (leadership only)
      parameters:
        - name: committeeId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Member roster.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
    post:
      tags: [Members]
      operationId: createMember
      summary: Create a single member (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberInput'
      responses:
        '200':
          description: Member created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Invalid input, or a member with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /members/bulk-import:
    post:
      tags: [Members]
      operationId: bulkImportMembers
      summary: Import multiple members at once (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImportMembersInput'
      responses:
        '200':
          description: Import complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportResult'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /members/{id}:
    get:
      tags: [Members]
      operationId: getMember
      summary: Get a single member by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Member found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [Members]
      operationId: updateMember
      summary: Update a member's role, committee, or status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberInput'
      responses:
        '200':
          description: Member updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
    delete:
      tags: [Members]
      operationId: deleteMember
      summary: Soft-delete a member (admin only). Hidden from rosters; attendance and audit history are preserved.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Member soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Already deleted, or cannot delete own account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /members/{id}/restore:
    post:
      tags: [Members]
      operationId: restoreMember
      summary: Restore a soft-deleted member (admin only).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Member restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Member is not deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /committees:
    get:
      tags: [Committees]
      operationId: listCommittees
      summary: List all committees with aggregate stats
      responses:
        '200':
          description: Committee list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Committee'

  /committees/{id}:
    get:
      tags: [Committees]
      operationId: getCommittee
      summary: Get a single committee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Committee found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Committee'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /committees/{id}/roster:
    get:
      tags: [Committees]
      operationId: getCommitteeRoster
      summary: Get the private member roster for a committee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Roster with per-member stats.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'

  /committees/mine:
    get:
      tags: [Committees]
      operationId: getMyCommittee
      summary: My Committee — chair or member view of their own committee
      description: >
        Chairs get the full private roster with per-member participation,
        impact points, and nudge status, plus upcoming events, recent
        activity, and a follow-up list of members below the participation
        goal. Plain members get their own stats and the committee's
        aggregate stats only — never a peer roster, preserving the
        chapter's privacy rule that individual standings are visible to
        leadership only.
      responses:
        '200':
          description: The caller's committee view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyCommittee'
        '404':
          description: Caller is not assigned to a committee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /committees/leaderboard:
    get:
      tags: [Committees]
      operationId: getCommitteeLeaderboard
      summary: Public committee leaderboard for the active semester
      responses:
        '200':
          description: Ranked committees.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommitteeLeaderboardEntry'

  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Upcoming, Active, Completed, Cancelled]
        - name: committeeId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Event list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create a new event (chair or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventInput'
      responses:
        '201':
          description: Event created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'

  /events/{id}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get a single event with attendees
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Update an event (chair or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventInput'
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
    delete:
      tags: [Events]
      operationId: deleteEvent
      summary: Cancel an event (chair or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Cancelled.

  /events/{id}/qr/activate:
    post:
      tags: [Events]
      operationId: activateEventQr
      summary: Activate dynamic QR check-in for an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: QR activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrToken'

  /events/{id}/qr/deactivate:
    post:
      tags: [Events]
      operationId: deactivateEventQr
      summary: Deactivate QR check-in and complete the event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: QR deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'

  /events/{id}/qr/current:
    get:
      tags: [Events]
      operationId: getCurrentEventQr
      summary: Get the current rotating QR token for an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Current rotating token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrToken'

  /events/{id}/check-in:
    post:
      tags: [Attendance]
      operationId: checkInToEvent
      summary: Check in to an event by scanning the QR token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInInput'
      responses:
        '200':
          description: Check-in confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResult'
        '400':
          description: Invalid or expired QR token, or already checked in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /events/{id}/attendance:
    get:
      tags: [Attendance]
      operationId: listEventAttendance
      summary: List attendance records for an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Attendance records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceRecord'
    post:
      tags: [Attendance]
      operationId: manualAttendance
      summary: Manually add or correct an attendance record (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualAttendanceInput'
      responses:
        '201':
          description: Attendance recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecord'

  /events/{id}/attendance/{attendanceId}:
    delete:
      tags: [Attendance]
      operationId: deleteEventAttendance
      summary: Remove a mis-scanned or incorrect attendance record (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: attendanceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Attendance record removed.
        '404':
          description: Attendance record not found for this event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /nudges:
    get:
      tags: [Nudges]
      operationId: listNudges
      summary: List nudge log entries (Executive Board / Admin)
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: integer
        - name: tier
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Nudge log.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NudgeLogEntry'

  /nudges/run:
    post:
      tags: [Nudges]
      operationId: runNudgeEvaluation
      summary: Recompute every member's nudge tier and emit messages
      responses:
        '200':
          description: Nudge run complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NudgeRunResult'

  /reports/scholarship-eligibility:
    get:
      tags: [Reports]
      operationId: getScholarshipEligibility
      summary: List members with scholarship eligibility flags
      parameters:
        - $ref: '#/components/parameters/ReportFormat'
      responses:
        '200':
          description: Eligibility list. When `format` is set, streams a CSV/XLSX/PDF file instead.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EligibilityRecord'

  /reports/conference-eligibility:
    get:
      tags: [Reports]
      operationId: getConferenceEligibility
      summary: Ranked list of members for conference selection
      parameters:
        - $ref: '#/components/parameters/ReportFormat'
      responses:
        '200':
          description: Ranked eligibility list. When `format` is set, streams a CSV/XLSX/PDF file instead.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EligibilityRecord'

  /reports/admin-overview:
    get:
      tags: [Reports]
      operationId: getAdminOverview
      summary: Chapter health overview for Executive Board / Admin
      parameters:
        - $ref: '#/components/parameters/ReportFormat'
      responses:
        '200':
          description: Overview metrics. When `format` is set, streams a CSV/XLSX/PDF file instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverview'

  /reports/committee/{id}:
    get:
      tags: [Reports]
      operationId: getCommitteeReport
      summary: Committee-level report (roster + participation + events)
      description: >
        Available to chapter-wide leadership roles, or the committee's own
        chair. Never exposes another committee's individual member data.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >
            Committee report. Accepts optional `semester` and `format`
            (csv/xlsx/pdf) query strings not modeled here to avoid an
            Orval path+query param naming collision; when `format` is set,
            streams a downloadable file instead of JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitteeReport'
        '403':
          description: Forbidden — not chapter-wide leadership or this committee's chair.
        '404':
          description: Committee not found.

  /reports/event/{id}:
    get:
      tags: [Reports]
      operationId: getEventReport
      summary: Event-level report (details + attendance roll)
      description: >
        Available to chapter-wide leadership roles, or the chair of the
        event's own committee.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >
            Event report. Accepts an optional `format` (csv/xlsx/pdf) query
            string not modeled here to avoid an Orval path+query param
            naming collision; when set, streams a downloadable file instead
            of JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReport'
        '403':
          description: Forbidden.
        '404':
          description: Event not found.

  /reports/member/{id}:
    get:
      tags: [Reports]
      operationId: getMemberReport
      summary: Member-level report (profile + eligibility + attendance history)
      description: >
        Available to chapter-wide leadership roles, the member's own
        committee chair, or the member themself.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >
            Member report. Accepts an optional `format` (csv/xlsx/pdf) query
            string not modeled here to avoid an Orval path+query param
            naming collision; when set, streams a downloadable file instead
            of JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberReport'
        '403':
          description: Forbidden.
        '404':
          description: Member not found.

  /org/settings:
    get:
      tags: [OrgSettings]
      operationId: getOrgSettings
      summary: Get organisation settings
      description: >
        Returns organisation-level configuration (identity, branding,
        participation thresholds). Public endpoint — used by the login page
        before the user signs in.
      responses:
        '200':
          description: Organisation settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
    patch:
      tags: [OrgSettings]
      operationId: updateOrgSettings
      summary: Update organisation settings (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgSettingsUpdate'
      responses:
        '200':
          description: Updated organisation settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
        '400':
          description: Missing required fields on first-time setup.
        '403':
          description: Forbidden — Admin role required.

  /event-type-config:
    get:
      tags: [EventTypeConfig]
      operationId: listEventTypeConfig
      summary: List auto-scoring rules for every event type (Admin/TechnologyChair only)
      responses:
        '200':
          description: Current point value and impact multiplier per event type.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventTypeConfig'
        '403':
          description: Forbidden — Admin or TechnologyChair role required.

  /event-type-config/{eventType}:
    patch:
      tags: [EventTypeConfig]
      operationId: updateEventTypeConfig
      summary: Update the auto-scoring rule for an event type (Admin/TechnologyChair only)
      description: >
        Changes only apply to events created after the update — existing
        events keep the point value they were created with.
      parameters:
        - name: eventType
          in: path
          required: true
          schema:
            type: string
            enum:
              - GeneralBodyMeeting
              - CommitteeMeeting
              - CommunityService
              - MentoringSession
              - Workshop
              - Fundraiser
              - Conference
              - Social
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeConfigUpdate'
      responses:
        '200':
          description: Updated scoring rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeConfig'
        '400':
          description: Invalid request.
        '403':
          description: Forbidden — Admin or TechnologyChair role required.
        '404':
          description: Unknown event type.

  /tech/impersonate:
    post:
      tags: [Tech]
      operationId: startImpersonation
      summary: Start role view impersonation (TechnologyChair only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartImpersonationInput'
      responses:
        '200':
          description: Impersonation started. Returns updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Invalid viewAs value.
        '403':
          description: Forbidden — TechnologyChair role required.
    delete:
      tags: [Tech]
      operationId: endImpersonation
      summary: End active role view impersonation (TechnologyChair only)
      responses:
        '200':
          description: Impersonation ended. Returns real profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '403':
          description: Forbidden — TechnologyChair role required.

  /system/info:
    get:
      tags: [System]
      operationId: getSystemInfo
      summary: Application/build identity info (for About page)
      responses:
        '200':
          description: Application identity and build info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'

  /system/releases:
    get:
      tags: [System]
      operationId: listSystemReleases
      summary: Desktop release history (for Release Notes viewer)
      responses:
        '200':
          description: Releases, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemRelease'

  /system/diagnostics:
    get:
      tags: [System]
      operationId: getSystemDiagnostics
      summary: Live system diagnostics (DB, auth, API) for the Diagnostics page
      responses:
        '200':
          description: Diagnostics snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemDiagnostics'

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    ReportFormat:
      name: format
      in: query
      required: false
      description: >
        When provided, the response is a downloadable file
        (`text/csv`, `.xlsx`, or `.pdf`) containing the same filtered data
        instead of a JSON body.
      schema:
        type: string
        enum: [csv, xlsx, pdf]
    ReportSemester:
      name: semester
      in: query
      required: false
      description: Restrict the report to a specific semester. Defaults to the active semester.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SystemInfo:
      type: object
      properties:
        appName:
          type: string
        chapterName:
          type: string
        description:
          type: string
        version:
          type: string
        buildNumber:
          type: string
        buildTimestamp:
          type: string
        environment:
          type: string
        serverTime:
          type: string
        copyright:
          type: string
        supportEmail:
          type: string
      required:
        - appName
        - chapterName
        - description
        - version
        - buildNumber
        - buildTimestamp
        - environment
        - serverTime
        - copyright
        - supportEmail

    SystemRelease:
      type: object
      properties:
        version:
          type: string
        channel:
          type: string
        releaseNotes:
          type: string
          nullable: true
        pubDate:
          type: string
      required:
        - version
        - channel
        - releaseNotes
        - pubDate

    SystemDiagnostics:
      type: object
      properties:
        database:
          type: object
          properties:
            connected:
              type: boolean
            latencyMs:
              type: number
            migrationVersion:
              type: string
              nullable: true
          required: [connected, latencyMs, migrationVersion]
        api:
          type: object
          properties:
            status:
              type: string
            latencyMs:
              type: number
          required: [status, latencyMs]
        environment:
          type: string
        serverTime:
          type: string
      required:
        - database
        - api
        - environment
        - serverTime

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Member:
      type: object
      required:
        - id
        - authId
        - fullName
        - email
        - role
        - committeeId
        - membershipStatus
        - duesPaid
        - totalPoints
        - impactPoints
        - participationPct
        - streakCount
        - nudgeStatus
        - accountActive
        - eventsAttended
        - eventsEligible
        - experience
        - officerPositions
      properties:
        id:
          type: integer
        authId:
          type: string
        fullName:
          type: string
        email:
          type: string
        phone:
          type: [string, 'null']
        studentId:
          type: [string, 'null']
        gpa:
          type: [number, 'null']
        graduationYear:
          type: [integer, 'null']
        role:
          type: string
          enum: [Member, CommitteeChair, BylawsChair, ExecutiveBoard, Admin, TechnologyChair]
        committeeId:
          type: [integer, 'null']
        committeeName:
          type: [string, 'null']
        committeeChairId:
          type: [integer, 'null']
        membershipStatus:
          type: string
          enum: [Active, Probationary, Suspended, Inactive]
        duesPaid:
          type: boolean
        dateJoined:
          type: [string, 'null']
          format: date-time
        totalPoints:
          type: integer
        impactPoints:
          type: integer
        participationPct:
          type: number
        streakCount:
          type: integer
        nudgeStatus:
          type: string
          enum: [Active, Warning, AtRisk, Critical]
        accountActive:
          type: boolean
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: Set when a member has been soft-deleted. Null for active members.
        lastLogin:
          type: [string, 'null']
          format: date-time
        eventsAttended:
          type: integer
        eventsEligible:
          type: integer
        profileImageUrl:
          type: [string, 'null']
        experience:
          type: string
          enum: [operations_console, committee_portal, member_portal]
        officerPositions:
          type: array
          items:
            type: string
        isTechChair:
          type: boolean
        systemRoles:
          type: array
          items:
            type: string
          description: System-level role slugs held by this member (e.g. "platform_admin", "technology_chair").
        orgRoles:
          type: array
          items:
            type: string
          description: Org-level role slugs held by this member (e.g. "president", "general_member").
        permissionGroups:
          type: array
          items:
            type: string
          description: Union of all permission group slugs granted to this member through system + org roles.
        impersonating:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ImpersonationState'
        availableExperiences:
          type: array
          items:
            type: string
            enum: [operations_console, committee_portal, member_portal]
          description: All experience shells this member legitimately qualifies for, for the multi-role "switch view" affordance.

    SwitchExperienceInput:
      type: object
      required: [experience]
      properties:
        experience:
          type: string
          enum: [operations_console, committee_portal, member_portal]

    UpdateProfileInput:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        studentId:
          type: string
        gpa:
          type: number
        graduationYear:
          type: integer

    CreateMemberInput:
      type: object
      required:
        - fullName
        - email
      properties:
        fullName:
          type: string
          minLength: 2
        email:
          type: string
        role:
          type: string
          enum: [Member, CommitteeChair, BylawsChair, ExecutiveBoard, Admin, TechnologyChair]
        committeeId:
          type: [integer, 'null']
        studentId:
          type: [string, 'null']
        membershipStatus:
          type: string
          enum: [Active, Probationary, Suspended, Inactive]

    BulkImportMembersInput:
      type: object
      required:
