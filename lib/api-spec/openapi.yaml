components:
  parameters:
    IdParam:
      in: path
      name: id
      required: true
      schema:
        type: integer

    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    ReportFormat:
      name: format
      in: query
      required: false
      description: >
        When provided, the response is a downloadable file
        (`text/csv`, `.xlsx`, or `.pdf`) containing the same filtered data
        instead of a JSON body.
      schema:
        type: string
        enum: [csv, xlsx, pdf]
    ReportSemester:
      name: semester
      in: query
      required: false
      description: Restrict the report to a specific semester. Defaults to the active semester.
      schema:
        type: string

  responses:
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SystemInfo:
      type: object
      properties:
        appName:
          type: string
        chapterName:
          type: string
        description:
          type: string
        version:
          type: string
        releaseChannel:
          type: string
          description: >-
            Human-readable release label (e.g. "Release Candidate 1")
            shown in the UI. Kept separate from `version` because
            installer version strings (Windows MSI in particular) cannot
            contain semver prerelease suffixes like "-rc1".
        buildNumber:
          type: string
        buildTimestamp:
          type: string
        environment:
          type: string
        serverTime:
          type: string
        copyright:
          type: string
        supportEmail:
          type: string
      required:
        - appName
        - chapterName
        - description
        - version
        - releaseChannel
        - buildNumber
        - buildTimestamp
        - environment
        - serverTime
        - copyright
        - supportEmail

    SystemRelease:
      type: object
      properties:
        version:
          type: string
        channel:
          type: string
        releaseNotes:
          type: string
          nullable: true
        pubDate:
          type: string
      required:
        - version
        - channel
        - releaseNotes
        - pubDate

    SystemDiagnostics:
      type: object
      properties:
        database:
          type: object
          properties:
            connected:
              type: boolean
            latencyMs:
              type: number
            migrationVersion:
              type: string
              nullable: true
          required: [connected, latencyMs, migrationVersion]
        api:
          type: object
          properties:
            status:
              type: string
            latencyMs:
              type: number
          required: [status, latencyMs]
        environment:
          type: string
        serverTime:
          type: string
      required:
        - database
        - api
        - environment
        - serverTime

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
