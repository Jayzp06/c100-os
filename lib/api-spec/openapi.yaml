openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: C100 System API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Profile
    description: Current user profile and onboarding
  - name: Members
    description: Chapter members
  - name: Committees
    description: Chapter committees
  - name: Events
    description: Chapter events and QR check-in
  - name: Attendance
    description: Member attendance records
  - name: Reports
    description: Eligibility, leaderboards, and dashboards
  - name: OrgSettings
    description: Organisation-level configuration (identity, branding, thresholds)
  - name: EventTypeConfig
    description: Admin-configurable auto-scoring rules per event type
  - name: System
    description: Application identity, release notes, and diagnostics
  - name: GovernanceDocs
    description: Bylaws Officer governance documents workspace
  - name: Secretary
    description: Secretary meeting records and correspondence
  - name: Treasurer
    description: Treasurer dues ledger and financial transactions
  - name: Historian
    description: Historian archive entries and media
  - name: Conduct
    description: Sergeant-at-Arms conduct records (confidential)
  - name: Procedure
    description: Parliamentarian motions, rulings, and quorum records
  - name: Storage
    description: Object storage presigned URL endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect after login.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /me:
    get:
      tags: [Profile]
      operationId: getMyProfile
      summary: Get the current member's profile and role
      responses:
        '200':
          description: Profile loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [Profile]
      operationId: updateMyProfile
      summary: Update the current member's profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileInput'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'

  /me/experience:
    post:
      tags: [Profile]
      operationId: switchMyExperience
      summary: Switch active view among experiences the member legitimately holds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchExperienceInput'
      responses:
        '200':
          description: Active experience switched. Returns updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Member does not hold a role granting that experience.
    delete:
      tags: [Profile]
      operationId: resetMyExperience
      summary: Reset active view back to the member's default (highest-priority) experience
      responses:
        '200':
          description: Experience override cleared. Returns default profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'

  /me/dashboard:
    get:
      tags: [Profile]
      operationId: getMyDashboard
      summary: Get the current member's dashboard payload
      responses:
        '200':
          description: Dashboard data assembled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDashboard'

  /members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: List all chapter members (leadership only)
      parameters:
        - name: committeeId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Member roster.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
    post:
      tags: [Members]
      operationId: createMember
      summary: Create a single member (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberInput'
      responses:
        '200':
          description: Member created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Invalid input, or a member with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /members/bulk-import:
    post:
      tags: [Members]
      operationId: bulkImportMembers
      summary: Import multiple members at once (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImportMembersInput'
      responses:
        '200':
          description: Import complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportResult'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /members/{id}:
    get:
      tags: [Members]
      operationId: getMember
      summary: Get a single member by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Member found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [Members]
      operationId: updateMember
      summary: Update a member's role, committee, or status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberInput'
      responses:
        '200':
          description: Member updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
    delete:
      tags: [Members]
      operationId: deleteMember
      summary: Soft-delete a member (admin only). Hidden from rosters; attendance and audit history are preserved.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Member soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Already deleted, or cannot delete own account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /members/{id}/restore:
    post:
      tags: [Members]
      operationId: restoreMember
      summary: Restore a soft-deleted member (admin only).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Member restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Member is not deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /committees:
    get:
      tags: [Committees]
      operationId: listCommittees
      summary: List all committees with aggregate stats
      responses:
        '200':
          description: Committee list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Committee'

  /committees/{id}:
    get:
      tags: [Committees]
      operationId: getCommittee
      summary: Get a single committee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Committee found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Committee'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /committees/{id}/roster:
    get:
      tags: [Committees]
      operationId: getCommitteeRoster
      summary: Get the private member roster for a committee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Roster with per-member stats.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'

  /committees/mine:
    get:
      tags: [Committees]
      operationId: getMyCommittee
      summary: My Committee — chair or member view of their own committee
      description: >
        Chairs get the full private roster with per-member participation,
        impact points, plus upcoming events, recent
        activity, and a follow-up list of members below the participation
        goal. Plain members get their own stats and the committee's
        aggregate stats only — never a peer roster, preserving the
        chapter's privacy rule that individual standings are visible to
        leadership only.
      responses:
        '200':
          description: The caller's committee view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyCommittee'
        '404':
          description: Caller is not assigned to a committee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /committees/leaderboard:
    get:
      tags: [Committees]
      operationId: getCommitteeLeaderboard
      summary: Public committee leaderboard for the active semester
      responses:
        '200':
          description: Ranked committees.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommitteeLeaderboardEntry'

  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Upcoming, Active, Completed, Cancelled]
        - name: committeeId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Event list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create a new event (chair or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventInput'
      responses:
        '201':
          description: Event created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'

  /events/{id}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get a single event with attendees
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Update an event (chair or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventInput'
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
    delete:
      tags: [Events]
      operationId: deleteEvent
      summary: Cancel an event (chair or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Cancelled.

  /events/{id}/permanent:
    delete:
      tags: [Events]
      operationId: permanentlyDeleteEvent
      summary: Permanently delete an event with no attendance history (technology chair or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Permanently deleted.
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Event has attendance history and cannot be permanently deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /events/{id}/qr/activate:
    post:
      tags: [Events]
      operationId: activateEventQr
      summary: Activate dynamic QR check-in for an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: QR activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrToken'

  /events/{id}/qr/deactivate:
    post:
      tags: [Events]
      operationId: deactivateEventQr
      summary: Deactivate QR check-in and complete the event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: QR deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'

  /events/{id}/qr/current:
    get:
      tags: [Events]
      operationId: getCurrentEventQr
      summary: Get the current rotating QR token for an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Current rotating token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrToken'

  /events/{id}/check-in:
    post:
      tags: [Attendance]
      operationId: checkInToEvent
      summary: Check in to an event by scanning the QR token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInInput'
      responses:
        '200':
          description: Check-in confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResult'
        '400':
          description: Invalid or expired QR token, or already checked in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /events/{id}/attendance:
    get:
      tags: [Attendance]
      operationId: listEventAttendance
      summary: List attendance records for an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Attendance records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceRecord'
    post:
      tags: [Attendance]
      operationId: manualAttendance
      summary: Manually add or correct an attendance record (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualAttendanceInput'
      responses:
        '201':
          description: Attendance recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecord'

  /events/{id}/attendance/{attendanceId}:
    delete:
      tags: [Attendance]
      operationId: deleteEventAttendance
      summary: Remove a mis-scanned or incorrect attendance record (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: attendanceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Attendance record removed.
        '404':
          description: Attendance record not found for this event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'


  /reports/scholarship-eligibility:
    get:
      tags: [Reports]
      operationId: getScholarshipEligibility
      summary: List members with scholarship eligibility flags
      parameters:
        - $ref: '#/components/parameters/ReportFormat'
      responses:
        '200':
          description: Eligibility list. When `format` is set, streams a CSV/XLSX/PDF file instead.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EligibilityRecord'

  /reports/conference-eligibility:
    get:
      tags: [Reports]
      operationId: getConferenceEligibility
      summary: Ranked list of members for conference selection
      parameters:
        - $ref: '#/components/parameters/ReportFormat'
      responses:
        '200':
          description: Ranked eligibility list. When `format` is set, streams a CSV/XLSX/PDF file instead.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EligibilityRecord'

  /reports/admin-overview:
    get:
      tags: [Reports]
      operationId: getAdminOverview
      summary: Chapter health overview for Executive Board / Admin
      parameters:
        - $ref: '#/components/parameters/ReportFormat'
      responses:
        '200':
          description: Overview metrics. When `format` is set, streams a CSV/XLSX/PDF file instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverview'

  /reports/committee/{id}:
    get:
      tags: [Reports]
      operationId: getCommitteeReport
      summary: Committee-level report (roster + participation + events)
      description: >
        Available to chapter-wide leadership roles, or the committee's own
        chair. Never exposes another committee's individual member data.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >
            Committee report. Accepts optional `semester` and `format`
            (csv/xlsx/pdf) query strings not modeled here to avoid an
            Orval path+query param naming collision; when `format` is set,
            streams a downloadable file instead of JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitteeReport'
        '403':
          description: Forbidden — not chapter-wide leadership or this committee's chair.
        '404':
          description: Committee not found.

  /reports/event/{id}:
    get:
      tags: [Reports]
      operationId: getEventReport
      summary: Event-level report (details + attendance roll)
      description: >
        Available to chapter-wide leadership roles, or the chair of the
        event's own committee.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >
            Event report. Accepts an optional `format` (csv/xlsx/pdf) query
            string not modeled here to avoid an Orval path+query param
            naming collision; when set, streams a downloadable file instead
            of JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReport'
        '403':
          description: Forbidden.
        '404':
          description: Event not found.

  /reports/member/{id}:
    get:
      tags: [Reports]
      operationId: getMemberReport
      summary: Member-level report (profile + eligibility + attendance history)
      description: >
        Available to chapter-wide leadership roles, the member's own
        committee chair, or the member themself.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >
            Member report. Accepts an optional `format` (csv/xlsx/pdf) query
            string not modeled here to avoid an Orval path+query param
            naming collision; when set, streams a downloadable file instead
            of JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberReport'
        '403':
          description: Forbidden.
        '404':
          description: Member not found.

  /org/settings:
    get:
      tags: [OrgSettings]
      operationId: getOrgSettings
      summary: Get organisation settings
      description: >
        Returns organisation-level configuration (identity, branding,
        participation thresholds). Public endpoint — used by the login page
        before the user signs in.
      responses:
        '200':
          description: Organisation settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
    patch:
      tags: [OrgSettings]
      operationId: updateOrgSettings
      summary: Update organisation settings (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgSettingsUpdate'
      responses:
        '200':
          description: Updated organisation settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
        '400':
          description: Missing required fields on first-time setup.
        '403':
          description: Forbidden — Admin role required.

  /event-type-config:
    get:
      tags: [EventTypeConfig]
      operationId: listEventTypeConfig
      summary: List auto-scoring rules for every event type (Admin/TechnologyChair only)
      responses:
        '200':
          description: Current point value and impact multiplier per event type.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventTypeConfig'
        '403':
          description: Forbidden — Admin or TechnologyChair role required.

  /event-type-config/{eventType}:
    patch:
      tags: [EventTypeConfig]
      operationId: updateEventTypeConfig
      summary: Update the auto-scoring rule for an event type (Admin/TechnologyChair only)
      description: >
        Changes only apply to events created after the update — existing
        events keep the point value they were created with.
      parameters:
        - name: eventType
          in: path
          required: true
          schema:
            type: string
            enum:
              - GeneralBodyMeeting
              - CommitteeMeeting
              - CommunityService
              - MentoringSession
              - Workshop
              - Fundraiser
              - Conference
              - Social
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeConfigUpdate'
      responses:
        '200':
          description: Updated scoring rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeConfig'
        '400':
          description: Invalid request.
        '403':
          description: Forbidden — Admin or TechnologyChair role required.
        '404':
          description: Unknown event type.

